<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema APR</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#172038">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="APR Seguridad">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy: #172038;
    --navy-2: #22304f;
    --paper: #F3F1EA;
    --card: #ffffff;
    --ink: #1C2333;
    --muted: #6B7280;
    --line: #E3DFD3;
    --green: #1E8E5A;
    --green-bg: #E4F4EC;
    --amber: #B9760C;
    --amber-bg: #FBF0DC;
    --red: #C13B32;
    --red-bg: #FBE9E7;
    --blue: #2C5AA8;
    --blue-bg: #E7EEF9;
    --purple: #6A4E9C;
    --purple-bg: #EFE9F7;
    --stamp: #C13B32;
    --radius: 14px;
    --disp: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: var(--body);
    background: transparent;
    color: var(--ink);
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background: var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow: 0 0 0 1px var(--line);
    border-radius: 18px;
    overflow:hidden;
  }

  /* Responsive: en tablet/escritorio se ve como una tarjeta centrada, no una app estirada */
  @media (min-width: 720px){
    body{ padding: 32px 16px; align-items:flex-start; }
    #app{ max-width:480px; min-height: calc(100vh - 64px); box-shadow: 0 12px 40px rgba(23,32,56,.14), 0 0 0 1px var(--line); }
  }
  @media (max-width: 380px){
    main{ padding-left:14px; padding-right:14px; }
    header.topbar{ padding-left:16px; }
  }

  /* Ticket rail / perforated edge signature element */
  .ticket-rail{
    position:absolute;
    left:0; top:0; bottom:0;
    width:6px;
    background: repeating-linear-gradient(180deg, var(--navy) 0 6px, transparent 6px 14px);
    opacity:.35;
    z-index:5;
  }

  header.topbar{
    background: var(--navy);
    color:#fff;
    padding:16px 18px 14px 22px;
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
  }
  header.topbar .back{
    cursor:pointer;
    font-size:20px;
    line-height:1;
    width:28px;
    color: rgba(255,255,255,.85);
  }
  header.topbar .titles{flex:1;}
  header.topbar .eyebrow{
    font-family: var(--mono);
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color: rgba(255,255,255,.55);
    margin-bottom:2px;
  }
  header.topbar h1{
    font-family: var(--disp);
    font-size:17px;
    margin:0;
    font-weight:600;
  }
  header.topbar .bell{
    cursor:pointer;
    width:34px; height:34px;
    border-radius:50%;
    background: rgba(255,255,255,.1);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    flex-shrink:0;
  }
  header.topbar .bell .dot{
    position:absolute; top:6px; right:7px;
    width:7px; height:7px; border-radius:50%;
    background: var(--stamp);
    border:1.5px solid var(--navy);
  }

  main{
    flex:1;
    padding: 18px 18px 100px 22px;
    overflow-y:auto;
  }

  /* Step rail (numbered process, since APR literally IS a sequential process) */
  .steprail{
    display:flex;
    align-items:center;
    gap:0;
    margin-bottom:20px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .steprail .seg{
    display:flex; align-items:center; flex-shrink:0;
  }
  .steprail .node{
    width:26px; height:26px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:11px; font-weight:600;
    background: var(--card);
    border:1.5px solid var(--line);
    color: var(--muted);
    flex-shrink:0;
  }
  .steprail .node.done{ background: var(--navy); border-color:var(--navy); color:#fff; }
  .steprail .node.current{ background:#fff; border-color:var(--navy); color:var(--navy); box-shadow:0 0 0 3px rgba(23,32,56,.12); }
  .steprail .bar{ width:14px; height:2px; background: var(--line); flex-shrink:0; }
  .steprail .bar.done{ background: var(--navy); }

  .eyebrow-label{
    font-family: var(--mono);
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color: var(--muted);
    margin: 0 0 6px 0;
  }
  h2.screen-title{
    font-family: var(--disp);
    font-size: 21px;
    margin: 0 0 4px 0;
    color: var(--navy);
  }
  p.screen-sub{
    color: var(--muted);
    font-size: 13.5px;
    margin:0 0 20px 0;
    line-height:1.4;
  }

  .card{
    background: var(--card);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding:16px;
    margin-bottom:14px;
  }

  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color: var(--ink);
    margin-bottom:5px;
  }
  .field .hint{ font-size:11px; color:var(--muted); margin-top:4px; }
  .field input, .field textarea, .field select{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:10px 11px;
    font-family: var(--body);
    font-size:14px;
    background:#fbfaf7;
    color: var(--ink);
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none;
    border-color: var(--navy);
    background:#fff;
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .worktype-list{ display:flex; flex-direction:column; gap:8px; }
  .worktype{
    display:flex; align-items:center; gap:11px;
    padding:12px 13px;
    border:1.5px solid var(--line);
    border-radius:11px;
    background:#fbfaf7;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    transition: border-color .12s, background .12s;
  }
  .worktype.sel{
    border-color: var(--navy);
    background: #fff;
    box-shadow: inset 0 0 0 1px var(--navy);
  }
  .worktype .cb{
    width:19px; height:19px; border-radius:5px;
    border:1.5px solid #C7C2B2;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#fff;
    background:#fff;
  }
  .worktype.sel .cb{ background: var(--navy); border-color:var(--navy); }

  .checklist-item{
    border:1px solid var(--line);
    border-radius:11px;
    padding:12px 13px;
    margin-bottom:9px;
    background: var(--card);
  }
  .checklist-item.critical{ border-left:3px solid var(--stamp); }
  .ci-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .ci-name{ font-size:13.5px; font-weight:600; line-height:1.35; }
  .ci-crit-tag{
    font-family:var(--mono); font-size:9px; letter-spacing:.06em;
    color: var(--stamp); text-transform:uppercase; margin-top:2px;
  }
  .ci-opts{ display:flex; gap:6px; flex-shrink:0; }
  .pill{
    font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:7px;
    border:1.5px solid var(--line); cursor:pointer; background:#fbfaf7; color:var(--muted);
    white-space:nowrap;
  }
  .pill.on.cumple{ background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .pill.on.na{ background:#EEECE4; border-color:#B8B2A0; color:#5b5647; }
  .ci-photo{
    margin-top:10px;
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--muted);
  }
  .photo-box{
    width:44px; height:44px; border-radius:8px;
    border:1.5px dashed #C7C2B2;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; background:#fbfaf7;
    font-size:16px; color:#B8B2A0;
    overflow:hidden;
  }
  .photo-box.attached{ border-style:solid; border-color:var(--green); background:var(--green-bg); color:var(--green); font-size:18px; }

  .btnbar{
    position:absolute; left:6px; right:0; bottom:0;
    background: linear-gradient(180deg, rgba(243,241,234,0) 0%, var(--paper) 30%);
    padding: 26px 18px 18px 22px;
    display:flex; gap:10px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:11px;
    padding:13px 16px;
    font-family:var(--body);
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    text-align:center;
  }
  .btn.primary{ background: var(--navy); color:#fff; }
  .btn.primary:disabled{ background:#B9C0CE; cursor:not-allowed; }
  .btn.ghost{ background:transparent; color:var(--navy); border:1.5px solid var(--line); flex:0 0 92px; }
  .btn.danger{ background: var(--red); color:#fff; }
  .btn.success{ background: var(--green); color:#fff; }
  .btn.outline-amber{ background:#fff; color:var(--amber); border:1.5px solid var(--amber); }

  .badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:700;
    padding:4px 10px; border-radius:20px;
    font-family: var(--mono); letter-spacing:.02em;
  }
  .badge.autorizado{ background:var(--green-bg); color:var(--green); }
  .badge.rechazado{ background:var(--red-bg); color:var(--red); }
  .badge.correccion{ background:var(--amber-bg); color:var(--amber); }
  .badge.pendiente{ background:var(--amber-bg); color:var(--amber); }
  .badge.ejecucion{ background:var(--blue-bg); color:var(--blue); }
  .badge.cerrado{ background:var(--purple-bg); color:var(--purple); }
  .badge.borrador{ background:#EEECE4; color:#6b6656; }

  .summary-row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid #EFEDE4; font-size:13.5px; }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row .k{ color:var(--muted); }
  .summary-row .v{ font-weight:600; text-align:right; }

  .folio{
    font-family: var(--mono); font-weight:700; font-size:15px; color:var(--navy);
    letter-spacing:.02em;
  }

  /* landing */
  .hero{
    background: var(--navy);
    color:#fff;
    margin: -18px -18px -18px -22px;
    padding: 30px 22px 34px 26px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; right:-40px; top:-40px;
    width:160px; height:160px; border-radius:50%;
    border: 1px solid rgba(255,255,255,.08);
  }
  .hero-badge{
    width:52px; height:52px; border-radius:13px;
    background: rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center;
    font-size:24px; margin-bottom:16px;
  }
  .hero h1{ font-family:var(--disp); font-size:25px; margin:0 0 6px 0; }
  .hero p{ color:rgba(255,255,255,.6); font-size:13.5px; margin:0; line-height:1.5; }
  .hero-cta{ margin-top:22px; display:flex; flex-direction:column; gap:9px; }
  .hero-cta .btn.primary{ background:#fff; color:var(--navy); }
  .hero-cta .btn.line{ background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.3); }

  .landing-body{ padding-top:22px; }
  .apr-card{
    display:flex; align-items:center; gap:12px;
    padding:13px; border:1px solid var(--line); border-radius:12px;
    background:var(--card); margin-bottom:9px; cursor:pointer;
  }
  .apr-card .fnum{ font-family:var(--mono); font-weight:700; font-size:13px; color:var(--navy); }
  .apr-card .meta{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .apr-card .flex1{ flex:1; }

  .empty-state{ text-align:center; padding:30px 10px; color:var(--muted); font-size:13px; }

  .role-switch{
    display:flex; gap:6px; margin-bottom:16px;
    background:#EEECE4; padding:3px; border-radius:9px;
  }
  .role-switch button{
    flex:1; border:none; background:transparent; padding:8px; border-radius:7px;
    font-size:12px; font-weight:600; color:var(--muted); cursor:pointer; font-family:var(--body);
  }
  .role-switch button.active{ background:#fff; color:var(--navy); box-shadow:0 1px 2px rgba(0,0,0,.08); }

  .notif-item{ display:flex; gap:10px; padding:12px 0; border-bottom:1px solid #EFEDE4; }
  .notif-item .ic{ width:32px; height:32px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .notif-item .txt{ font-size:13px; line-height:1.4; }
  .notif-item .t{ font-size:11px; color:var(--muted); margin-top:2px; }

  .rule-item{ display:flex; gap:9px; font-size:12.5px; padding:8px 0; border-bottom:1px solid #EFEDE4; line-height:1.4; color:var(--ink); }
  .rule-item:last-child{ border-bottom:none; }
  .rule-item .n{ font-family:var(--mono); color:var(--muted); flex-shrink:0; }

  ::-webkit-scrollbar{ width:0; height:0; }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
    background: var(--navy); color:#fff; padding:11px 18px; border-radius:10px;
    font-size:13px; font-weight:600; z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.2);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  textarea{ resize:none; min-height:64px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ===================== DATA ===================== */
const WORK_TYPES = [
  {key:'alturas', label:'Trabajo en alturas'},
  {key:'caliente', label:'Trabajo en caliente (soldadura / corte)'},
  {key:'electrico', label:'Trabajo eléctrico'},
  {key:'confinado', label:'Espacio confinado'},
  {key:'izaje', label:'Izaje / maniobras'},
  {key:'excavacion', label:'Excavación'},
  {key:'loto', label:'Bloqueo y etiquetado (LOTO)'},
  {key:'quimicos', label:'Sustancias químicas peligrosas'},
  {key:'plataformas', label:'Uso de plataformas de elevación'},
  {key:'contratistas', label:'Trabajo con contratistas'},
  {key:'otro', label:'Otro'},
];

const EQUIPO_ALTURAS = [
  {key:'plataforma', label:'Plataforma de elevación'},
  {key:'tijera', label:'Escalera de tijera'},
  {key:'extension', label:'Escalera de extensión'},
  {key:'andamios', label:'Andamios'},
  {key:'otro_equipo', label:'Otro'},
];

function critItems(names, criticalIdx){
  return names.map((n,i)=>({
    id: 'ci_'+Math.random().toString(36).slice(2,9),
    name:n, critical: criticalIdx.includes(i), status:null, photo:null
  }));
}

const CHECKLIST_TEMPLATES = {
  alturas_epp: ()=>critItems([
    'Arnés de cuerpo completo en buen estado',
    'Línea de vida en buen estado',
    'Ganchos con doble seguro funcional',
    'Absorbedor de impacto en buen estado',
    'Punto de anclaje identificado',
    'Punto de anclaje resistente y autorizado',
    'Casco con barboquejo',
    'Calzado de seguridad',
    'Capacitación vigente para trabajo en alturas',
  ], [0,1,2,3,4,5,8]),
  caliente: ()=>critItems([
    'Permiso de trabajo en caliente vigente',
    'Extintor disponible en el área',
    'Retiro de materiales combustibles cercanos',
    'Vigía de fuego asignado',
    'Pantallas contra chispa colocadas',
  ], [0,2,3]),
  electrico: ()=>critItems([
    'Bloqueo y etiquetado (LOTO) aplicado',
    'Prueba de ausencia de tensión realizada',
    'Guantes dieléctricos en buen estado',
    'Herramienta aislada verificada',
  ], [0,1]),
  confinado: ()=>critItems([
    'Permiso de entrada a espacio confinado vigente',
    'Medición de gases realizada',
    'Vigía externo asignado',
    'Equipo de rescate disponible',
    'Ventilación forzada instalada',
  ], [0,1,3]),
  izaje: ()=>critItems([
    'Inspección de grúa / equipo de izaje',
    'Aparejos y eslingas en buen estado',
    'Radio de giro delimitado',
    'Operador certificado vigente',
  ], [0,3]),
  excavacion: ()=>critItems([
    'Estudio de mecánica de suelos disponible',
    'Taludes o entibados adecuados',
    'Señalización perimetral colocada',
    'Servicios subterráneos identificados',
  ], [1,3]),
  loto: ()=>critItems([
    'Candados y tarjetas de bloqueo colocados',
    'Verificación de energía cero',
    'Lista de puntos de bloqueo firmada',
  ], [0,1,2]),
  quimicos: ()=>critItems([
    'Hoja de seguridad (MSDS) disponible',
    'EPP químico específico verificado',
    'Ducha / lavaojos de emergencia accesible',
  ], [0,2]),
  plataformas: ()=>critItems([
    'Inspección diaria de la plataforma',
    'Barandales y compuertas en buen estado',
    'Anclaje de arnés dentro de la canastilla',
  ], [0,1,2]),
  contratistas: ()=>critItems([
    'Documentación legal del contratista vigente',
    'Inducción de seguridad impartida',
    'Seguro de responsabilidad civil vigente',
  ], [0,1]),
  otro: ()=>critItems([
    'Análisis de riesgo específico documentado',
    'Medidas de control verificadas',
  ], [0]),
  equipo_plataforma: ()=>critItems([
    'Plataforma inspeccionada antes de uso',
    'Barandal y compuerta de acceso en buen estado',
    'Anclaje del arnés dentro de la plataforma',
  ], [0,2]),
  equipo_tijera: ()=>critItems([
    'Escalera con zapatas antiderrapantes',
    'Ángulo de apertura correcto y trabado',
    'Superficie de apoyo nivelada',
  ], [1]),
  equipo_extension: ()=>critItems([
    'Amarre superior de la escalera verificado',
    'Ángulo 4:1 correcto',
    'Sobrepasa el punto de apoyo 1m',
  ], [0]),
  equipo_andamios: ()=>critItems([
    'Andamio armado por personal certificado',
    'Barandales y rodapiés instalados',
    'Tarjeta de andamio (verde) colocada',
  ], [0,2]),
  equipo_otro: ()=>critItems([
    'Equipo inspeccionado antes de uso',
    'Capacitación de uso vigente',
  ], []),
};

const TYPE_LABEL = Object.fromEntries(WORK_TYPES.map(t=>[t.key,t.label]));

/* ===================== MÉTODO DE EVALUACIÓN DE RIESGOS (formato SKF) ===================== */
// S = Severidad, F = Frecuencia, P = Probabilidad de ocurrencia, PR = Posibilidad de reducir ocurrencia
const RISK_MATRIX = {
  'S1_F1_P1_PR1':1, 'S1_F1_P1_PR2':1, 'S1_F1_P2_PR1':1, 'S1_F1_P2_PR2':2, 'S1_F1_P3_PR1':2, 'S1_F1_P3_PR2':2,
  'S1_F2_P1_PR1':1, 'S1_F2_P1_PR2':2, 'S1_F2_P2_PR1':2, 'S1_F2_P2_PR2':2, 'S1_F2_P3_PR1':2, 'S1_F2_P3_PR2':4,
  'S2_F1_P1_PR1':2, 'S2_F1_P1_PR2':2, 'S2_F1_P2_PR1':2, 'S2_F1_P2_PR2':4, 'S2_F1_P3_PR1':4, 'S2_F1_P3_PR2':4,
  'S2_F2_P1_PR1':3, 'S2_F2_P1_PR2':4, 'S2_F2_P2_PR1':4, 'S2_F2_P2_PR2':5, 'S2_F2_P3_PR1':5, 'S2_F2_P3_PR2':6,
};
const S_OPTS = [{v:'S1',t:'S1 · Lesión leve'},{v:'S2',t:'S2 · Lesión seria'}];
const F_OPTS = [{v:'F1',t:'F1 · ≤2 veces/turno o <15 min'},{v:'F2',t:'F2 · >2 veces/turno o >15 min'}];
const P_OPTS = [{v:'P1',t:'P1 · Controles robustos'},{v:'P2',t:'P2 · Falló hace +3 meses'},{v:'P3',t:'P3 · Falló hace -3 meses'}];
const PR_OPTS = [{v:'PR1',t:'PR1 · Posible bajo ciertas condiciones'},{v:'PR2',t:'PR2 · Imposible'}];

function calcRiesgo(s,f,p,pr){
  if(!s||!f||!p||!pr) return null;
  return RISK_MATRIX[`${s}_${f}_${p}_${pr}`] ?? null;
}
function riskBand(n){

/* ===================== STEP RAIL ===================== */
const STEP_LABELS = ['Datos','Riesgo','Tipo','Checklist','Resumen','Envío','Revisión','Resultado'];
function stepRail(current){
  let html = '<div class="steprail">';
  STEP_LABELS.forEach((lbl,i)=>{
    const n = i+1;
    let cls = 'node';
    if(n < current) cls += ' done';
    else if(n === current) cls += ' current';
    html += `<div class="seg"><div class="${cls}">${n < current ? '✓' : n}</div></div>`;
    if(i < STEP_LABELS.length-1){
      html += `<div class="bar ${n<current?'done':''}"></div>`;
    }
  });
  html += '</div>';
  return html;
}

function statusBadge(status){
  const map = {
    borrador:['Borrador','borrador'],
    pendiente:['Pendiente EHS','pendiente'],
    autorizado:['Autorizado','autorizado'],
    rechazado:['Rechazado','rechazado'],
    correccion:['En corrección','correccion'],
    ejecucion:['En ejecución','ejecucion'],
    cerrado:['Cerrado','cerrado'],
  };
  const [lbl,cls] = map[status] || ['—','borrador'];
  return `<span class="badge ${cls}">${lbl}</span>`;
}

async function guardarAprEnBD(draft){
  const { data: apr, error } = await sb.from('aprs').insert({
    folio: draft.folio,
    creado_por: state.user.id,
    empresa: draft.datos.empresa,
    fecha: draft.datos.fecha || null,
    hora_inicio: draft.datos.horaInicio || null,
    trabajadores: draft.datos.trabajadores ? Number(draft.datos.trabajadores) : null,
    area: draft.datos.area,
    descripcion: draft.datos.descripcion,
    responsable_interno: draft.datos.responsableInterno,
    supervisor_seguridad: draft.datos.supervisorSeguridad,
    tipos_trabajo: draft.tipos,
    equipo: draft.equipo,
    clima_aplica: draft.clima.aplica,
    clima_medidas: draft.clima.medidas || null,
    status: 'pendiente',
  }).select().single();
  if(error){ console.error(error); return null; }

  for(let i=0;i<draft.pasos.length;i++){
    const p = draft.pasos[i];
    await sb.from('pasos_riesgo').insert({
      apr_id: apr.id, orden: i,
      descripcion: p.descripcion, peligro: p.peligro,
      severidad: p.s, frecuencia: p.f, probabilidad: p.p, posibilidad_reduccion: p.pr,
      riesgo_valor: calcRiesgo(p.s,p.f,p.p,p.pr),
      controles: p.controles,
    });
  }

  for(const cl of draft.checklists){
    const { data: checklist } = await sb.from('checklists')
      .insert({ apr_id: apr.id, clave: cl.key, titulo: cl.title })
      .select().single();
    for(const item of cl.items){
      await sb.from('checklist_items').insert({
        checklist_id: checklist.id,
        nombre: item.name,
        critico: item.critical,
        status: item.status,
        foto_url: item.photo || null,
      });
    }
  }

  await sb.from('notificaciones').insert({
    apr_id: apr.id, para_rol: 'jefe_seguridad',
    texto: `Nuevo APR ${apr.folio} pendiente de aprobación (EHS)`,
  });

  return apr;
}

async function enviarAEhs(){
  showToast('Enviando APR...');

  state.draft.id = apr.id;
  state.draft.status = 'pendiente';
  await loadAprsFromDB();
  await loadNotificaciones();
  showToast('APR enviado a EHS');
  nav('enviado');
}

  let html = '<div class="ticket-rail"></div>';
  switch(state.screen){
    case 'login': html += renderLogin(); break;
    case 'landing': html += renderLanding(); break;
    case 'mis-aprs': html += renderMisAprs(); break;
    case 'nuevo-datos': html += renderNuevoDatos(); break;
    case 'nuevo-riesgo': html += renderNuevoRiesgo(); break;
    case 'nuevo-tipo': html += renderNuevoTipo(); break;
    case 'nuevo-equipo': html += renderNuevoEquipo(); break;
    case 'nuevo-checklist': html += renderNuevoChecklist(); break;
    case 'nuevo-resumen': html += renderResumen(); break;
    case 'enviado': html += renderEnviado(); break;
    case 'revision': html += renderRevision(); break;
    case 'resultado': html += renderResultado(); break;
    case 'notificaciones': html += renderNotificaciones(); break;
    case 'admin': html += renderAdmin(); break;
    case 'reglas': html += renderReglas(); break;
    default: html += renderLanding();
  }
  document.getElementById('app').innerHTML = html;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

render();
initApp();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.error('SW error:', err));
  });
}
</script>
</body>
</html>
